apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 5
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      name: p1
      labels:
        app: flask
    spec:
      containers:
      - name: c1
        image: pythoncpp/myapp:v4
        ports:
        - containerPort: 4000

---

apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  type: NodePort
  selector:
    app: flask
  ports:
  - port: 4000
    targetPort: 4000 
















