apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: rs1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: myApp
  template:
    metadata:
      name: p1
      labels:
        app: myApp
    spec:
      containers:
      - name: c1
        image: nginx
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: nginx-service
spec:
  type: NodePort
  selector:
    app: myApp
  ports:
  - port: 80
    targetPort: 80
